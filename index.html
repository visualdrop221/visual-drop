<style>
    :root {
        --bg-color: #0b1020;
        --text-color: #ffffff;
        --card-bg: #151c33;
        --nav-bg: #0b1020;
        --accent-color: #4f46e5;
        --border-color: #232d4b;
    }

    [data-theme="light"] {
        --bg-color: #f8fafc;
        --text-color: #0f172a;
        --card-bg: #ffffff;
        --nav-bg: #ffffff;
        --accent-color: #6366f1;
        --border-color: #e2e8f0;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s, color 0.3s;
    }

    header {
        background-color: var(--nav-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: bold;
    }

    nav {
        display: flex;
        gap: 1.5rem;
        align-items: center;
    }

    nav a {
        color: var(--text-color);
        text-decoration: none;
        font-size: 1rem;
        transition: color 0.2s;
    }

    nav a:hover {
        color: var(--accent-color);
    }

    .theme-toggle-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.9rem;
        transition: all 0.3s;
    }

    .theme-toggle-btn:hover {
        border-color: var(--accent-color);
    }

    main {
        padding: 4rem 2rem;
        max-width: 1200px;
        margin: 0 auto;
        text-align: center;
    }

    .hero h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
    }

    .hero p {
        font-size: 1.2rem;
        opacity: 0.8;
    }
</style>
</head>
<body>

    <header>
        <div class="logo">Visual DROP</div>
        <nav>
            <a href="#home">الرئيسية</a>
            <a href="#services">خدماتنا</a>
            <a href="#about">من نحن</a>
            <a href="#contact">تواصل معنا</a>
            
            <!-- زر التبديل بين الوضع المضيء والمظلم -->
            <button class="theme-toggle-btn" id="themeToggle" aria-label="تبديل الوضع">
                <span id="themeIcon">🌙</span>
                <span id="themeText">الوضع المظلم</span>
            </button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>أهلاً بك في Visual DROP</h1>
            <p>استوديو متخصص في تصميم الشعارات، الهوية البصرية، والسوشيال ميديا.</p>
        </section>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        // استرجاع تفضيل المستخدم المحفوظ
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.textContent = '☀️';
            themeText.textContent = 'الوضع المضيء';
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'الوضع المظلم';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'الوضع المضيء';
            }
        });
    </script>
</body>
